# Publish a finished search round to /admin again, from its saved artifacts (owner, 13 Nov 2026: "I shouldn't get it anymore", after a round's rows
# were stored before the `ai` field existed and old rows of another line stayed beside them). No AI, no search, no Telegram note: it reads the run's
# own artifacts (the judged lists and ours' logs), turns them into rows with today's publish.mjs and sends them. By hand only.
# Why the order matters: rows are upserted by id (round/pN/tool), so when a person was re-run alone (a spoiled wait), republish the full run first
# and the one-person run second; the last write wins.
name: search republish (by hand)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The finished search-round run whose artifacts are published again
        required: true
      round:
        description: The round's key on /admin (the key the run was published under, e.g. 2026-11-13)
        required: true
permissions:
  contents: read
  actions: read   # reads the run's artifacts
jobs:
  republish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v5
        with: {path: art, pattern: 'search-*', run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}'}
      - name: The round's work folder from its artifacts (the same pool step as the judge job; the verdicts are copied, never judged again)
        run: |
          node search-bench/pool.mjs art work
          cp art/search-round-judged/work/judged*.json work/
          ls work | head -30
      - name: Publish to /admin/job-search/benchmark
        env:
          SELFHEAL_PUBLISH_KEY: ${{ secrets.BENCHMARK_PUBLISH_KEY }}
          ROUND: ${{ inputs.round }}
        run: node search-bench/publish.mjs work --round "$ROUND" --build "$(cat work/build.txt)"
